name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code. It has no secrets and can't write to the repo.
permissions:
  contents: read

# A new push to a pull request replaces the run that was still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known serious vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          STATUS_SAMPLE_DATA: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
