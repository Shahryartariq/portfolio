name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code. It has no secrets and can't write to the repo.
permissions:
  contents: read

# A new push to a pull request replaces the run that was still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to the exact commit behind each tag, so a moved tag can't
# change what runs here. Dependabot keeps the hashes and comments up to date.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known serious vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          STATUS_SAMPLE_DATA: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
